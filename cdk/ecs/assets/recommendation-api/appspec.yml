version: 0.0
os: linux
file_exists_behavior: OVERWRITE
files:
  - source: /
    destination: /home/ec2-user/app
  - source: hackathon-nexus-recommendation-api.service
    destination: /etc/systemd/system
permissions:
  - object: /home/ec2-user/app
    owner: ec2-user
    group: ec2-user
    type:
      - file
      - directory
hooks:
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
  ValidateService:
    - location: scripts/validate.sh
      timeout: 360
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 300
