version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
  build:
    commands:
      - cd hackathon-nexus-api
      - npm i
      - npm run build
      - npm prune --omit=dev
      - cp -r ../cdk/ec2-ci-cd/assets/main-api/appspec.yml ../cdk/ec2-ci-cd/assets/main-api/hackathon-nexus-api.service ../cdk/ec2-ci-cd/assets/main-api/scripts .
      - chmod +x scripts/*.sh

artifacts:
  base-directory: hackathon-nexus-api
  files:
    - dist/**/*
    - node_modules/**/*
    - package.json
    - appspec.yml
    - hackathon-nexus-api.service
    - scripts/**/*
